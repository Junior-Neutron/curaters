<template id="t-home">

  <!-- HERO -->
  <section class="hero" id="hero" aria-label="Curaters">
    <div class="hero-slides" id="heroSlides" aria-hidden="true"></div>
    <div class="container hero-inner">
      <div class="hero-copy">
        <p class="eyebrow">Curated African travel experiences</p>
        <h1>Travel, turned <em>into art.</em></h1>
        <p class="lead">From Ghana's castles and canopy walkways to the Maasai Mara, Kilimanjaro, Zanzibar and the Namib dunes, Curaters designs journeys across Africa that are deeply felt and impossible to forget.</p>
        <div class="hero-cta">
          <a class="btn btn-primary magnetic" href="#/destinations">Explore destinations <svg class="ico"><use href="#i-arrow"/></svg></a>
          <a class="btn btn-light magnetic" href="#/plan">Request a trip</a>
        </div>
      </div>
      <aside class="hero-side" aria-label="Live destination conditions">
        <div class="live-card" id="heroLive">
          <div class="where"><div><p class="live-pulse"><span class="dot"></span> Live now in</p><h2 id="hlName">…</h2></div><a id="hlLink" href="#/destinations">Guide <svg class="ico"><use href="#i-arrow"/></svg></a></div>
          <div class="live-row">
            <div><p>Local time</p><p id="hlTime">--:--</p></div>
            <div><p>Weather</p><p id="hlWx">–</p></div>
            <div><p id="hlSunK">Sunset</p><p id="hlSun">–</p></div>
          </div>
          <p class="credit" id="hlCredit"></p>
        </div>
        <div class="hero-dots" id="heroDots" role="tablist" aria-label="Featured destinations"></div>
      </aside>
    </div>
  </section>

  <!-- LIVE TICKER -->
  <section class="ticker" aria-label="Live local time and weather across destinations">
    <div class="ticker-track" id="ticker"></div>
  </section>

  <!-- IN SEASON -->
  <section class="section" id="season">
    <div class="container">
      <div class="section-head reveal">
        <div><p class="eyebrow" id="seasonEyebrow">In season</p><h2 id="seasonTitle">Where to go <em class="it">right now</em></h2></div>
        <div style="display:grid;gap:18px;justify-items:start"><p class="lead">Ranked by how well each destination suits the current month. Drag, swipe or use the arrows.</p>
          <div class="rail-ctl"><button class="round prev" id="railPrev" type="button" aria-label="Previous"><svg class="ico"><use href="#i-arrow"/></svg></button><button class="round next" id="railNext" type="button" aria-label="Next"><svg class="ico"><use href="#i-arrow"/></svg></button></div></div>
      </div>
      <div class="rail-wrap"><div class="rail" id="rail" tabindex="0" aria-label="Destinations in season"></div></div>
    </div>
  </section>

  <!-- MONTH PLANNER -->
  <section class="section" style="padding-top:0" id="when">
    <div class="container">
      <div class="planner reveal">
        <p class="eyebrow" style="color:var(--terra-l)">Plan by month</p>
        <h2>When do you want to <em class="it" style="color:var(--terra-l)">travel?</em></h2>
        <p class="lead">Pick a month and see the destinations that suit it best.</p>
        <div class="months" id="months" role="group" aria-label="Travel month"></div>
        <div class="pickrows" id="pickrows" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <!-- TRIP FORMATS -->
  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="section-head reveal"><div><p class="eyebrow">Ways to travel</p><h2>Four ways to <em class="it">go</em></h2></div><p class="lead">Whether it is a single golden day on the coast or a journey designed entirely around you.</p></div>
      <div class="tiles" id="tiles"></div>
    </div>
  </section>

  <!-- HOW IT WORKS -->
  <section class="section" style="padding-top:0">
    <div class="container how">
      <div>
        <p class="eyebrow reveal">How it works</p>
        <h2 class="reveal" style="font-size:clamp(2rem,4.4vw,3.2rem);margin:12px 0 28px">From first idea to <em class="it">unforgettable</em></h2>
        <div class="steps reveal" id="steps"></div>
      </div>
      <div class="how-visual reveal" id="howVisual"><div class="cap"><p class="eyebrow" style="color:var(--terra-l)" id="howK">Step 1</p><h3 id="howT"></h3></div></div>
    </div>
  </section>

  <!-- STATS -->
  <section class="stats reveal" aria-label="Curaters in numbers" id="stats"></section>

  <!-- CTA -->
  <section class="section">
    <div class="container">
      <div class="cta-band reveal" id="cta">
        <div class="ph" id="ctaPh" style="--hue:30"><img alt="" decoding="async" loading="lazy"><div class="ph-fb"></div></div>
        <p class="eyebrow" style="color:var(--terra-l)">Request a trip</p>
        <h2>Tell us where your heart is <em class="it" style="color:var(--terra-l)">pointing.</em></h2>
        <p class="lead">Start with a destination and a month. We'll take it from there.</p>
        <form class="quick-form" id="quick">
          <select class="field" name="dest" aria-label="Destination"></select>
          <select class="field" name="month" aria-label="Month"></select>
          <input class="field" type="number" name="n" min="1" max="30" value="2" aria-label="Number of travellers">
          <button class="btn btn-primary" type="submit">Start planning <svg class="ico"><use href="#i-arrow"/></svg></button>
        </form>
      </div>
    </div>
  </section>
</template>
<template id="t-destinations">
  <header class="page-head container">
    <p class="eyebrow">Curated African travel experiences</p>
    <h1>Destinations</h1>
    <p class="lead">Real places, real conditions. Local time, weather and the best months to go update live, so you can choose with confidence.</p>
    <p class="upd"><span class="dot"></span><span id="upd">Live data loading…</span></p>
  </header>

  <section class="container" style="padding-bottom:20px">
    <div class="controls" id="controls">
      <div class="ctl-row">
        <div class="search"><svg class="ico"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search a place, country or experience" aria-label="Search destinations" autocomplete="off"></div>
        <select class="field" id="region" aria-label="Region"><option value="">All regions</option></select>
        <select class="field" id="sort" aria-label="Sort by">
          <option value="rec">Recommended</option><option value="season">Best this month</option><option value="warm">Warmest right now</option><option value="az">A – Z</option>
        </select>
        <div class="seg" role="group" aria-label="Layout"><button type="button" data-view="grid" aria-pressed="true">Grid</button><button type="button" data-view="bento" aria-pressed="false">Mosaic</button><button type="button" data-view="list" aria-pressed="false">List</button></div>
      </div>
      <div class="ctl-row">
        <div class="chips" id="themes" role="group" aria-label="Experience type"></div>
        <label class="switch"><input type="checkbox" id="inSeason"> In season now</label>
        <span class="count-line" id="count" aria-live="polite"></span>
      </div>
    </div>
    <div class="dgrid" id="grid" data-view="grid"></div>
  </section>
</template>
<template id="t-destination">
  <section class="dhero" id="dhero">
    <div class="slides" id="dslides" aria-hidden="true"></div>
    <div class="container dhero-in">
      <p class="crumbs"><a href="#/">Home</a><span>/</span><a href="#/destinations">Destinations</a><span>/</span><span id="crumb"></span></p>
      <p class="eyebrow" id="dEyebrow" style="color:var(--terra-l);margin-top:26px"></p>
      <h1 id="dName"></h1>
      <p class="lead" id="dTag"></p>
      <div class="dhero-actions">
        <a class="btn btn-primary magnetic" id="dPlan" href="#/plan">Plan this trip <svg class="ico"><use href="#i-arrow"/></svg></a>
        <button class="btn btn-light magnetic" type="button" id="dWish" aria-pressed="false" data-wish><span class="on-t">Added to my trip</span><span class="off-t">Add to my trip</span></button>
      </div>
      <div class="thumbs" id="dThumbs" aria-label="Photo selector"></div>
    </div>
    <p class="credit" id="dCredit"></p>
  </section>

  <section class="section" style="padding-bottom:0">
    <div class="container dlayout">
      <div>
        <div class="prose reveal"><p class="eyebrow">About this place</p><h2 id="dH2"></h2><p id="dDesc"></p></div>
        <div class="reveal" style="margin-top:44px"><p class="eyebrow">Highlights</p><ul class="hl-list" id="dHl"></ul></div>
        <div class="reveal" style="margin-top:56px"><p class="eyebrow">Photographs</p><h2 style="font-size:clamp(1.8rem,3.4vw,2.6rem);margin:10px 0 20px">The real thing</h2><div class="gallery" id="gallery"></div><p class="muted" style="margin-top:12px">Free-licensed photographs from Wikimedia Commons. Tap any image to enlarge and see its credit.</p></div>
      </div>
      <aside class="sticky">
        <div class="panel reveal"><h3>Live conditions <span class="live-pulse" style="color:var(--ok)"><span class="dot"></span> Live</span></h3><div id="live"><p class="muted">Loading…</p></div></div>
        <div class="panel reveal"><h3>7-day forecast</h3><div id="fc"><p class="muted">Loading…</p></div></div>
        <div class="panel reveal"><h3>Best time to go</h3><div id="months"></div>
          <div class="legend"><span><i style="background:var(--terra)"></i>Prime</span><span><i style="background:var(--terra-l)"></i>Good</span><span><i style="background:#e2d3bd"></i>Fair</span><span><i style="background:#efe6d6"></i>Off-season</span></div>
          <p class="advice" id="dAdvice"></p></div>
        <div class="panel reveal"><h3>At a glance</h3><dl class="facts" id="facts"></dl></div>
      </aside>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head reveal"><div><p class="eyebrow">Keep exploring</p><h2>You might also <em class="it">love</em></h2></div></div>
      <div class="dgrid" id="related"></div>
    </div>
  </section>
</template>
<template id="t-trips">
  <header class="page-head container">
    <p class="eyebrow">Curated travel experiences</p>
    <h1 id="tTitle">Day Trips</h1>
    <p class="lead" id="tIntro"></p>
  </header>

  <section class="container" style="padding-bottom:10px">
    <div class="tabs-wrap"><div class="tabs" id="tabs" role="tablist" aria-label="Trip type"><span class="ind" id="ind"></span></div></div>
    <div class="cur-switch"><span>Show prices in</span><div class="seg" id="cur" role="group" aria-label="Currency"></div><span id="fxNote"></span></div>
    <div class="tgrid" id="tgrid" aria-live="polite"></div>
  </section>
</template>
<template id="t-plan">
  <header class="page-head container">
    <p class="eyebrow">Request a trip</p>
    <h1>Plan your journey</h1>
    <p class="lead">Three quick steps. We reply personally by email with ideas, not a form letter.</p>
  </header>
  <section class="container">
    <div class="plan">
      <form id="planForm" novalidate>
        <div class="stepper" id="stepper"></div>

        <div class="fstep on" data-step="0">
          <h2>Where does your heart point?</h2>
          <p class="muted">Pick as many places as you like. Not sure? Skip ahead and we will suggest some.</p>
          <div class="pick-grid" id="picks"></div>
          <div class="nav-row"><span></span><button type="button" class="btn btn-dark" data-next>Next <svg class="ico"><use href="#i-arrow"/></svg></button></div>
        </div>

        <div class="fstep" data-step="1">
          <h2>When, and with whom?</h2>
          <p class="muted">Months show how well your chosen places suit them.</p>
          <div class="f"><span class="lbl">Month of travel</span><div class="monthgrid" id="monthgrid"></div></div>
          <div class="advice" id="fit" aria-live="polite" hidden></div>
          <div class="form-grid" style="margin-top:26px">
            <div class="f"><span class="lbl">Travellers</span><div class="stepper-num"><button type="button" id="nMinus" aria-label="Fewer travellers">&minus;</button><output id="nOut">2</output><button type="button" id="nPlus" aria-label="More travellers">+</button></div></div>
            <div class="f"><label for="nights">Nights: <b id="nightsOut">7</b></label><input type="range" id="nights" min="1" max="21" value="7"></div>
            <div class="f full"><label for="budget">Budget per person: <b id="budgetOut"></b></label><input type="range" id="budget" min="300" max="10000" step="100" value="2500"><div class="range-out"><span>Essential</span><span id="budgetFx"></span><span>Luxury</span></div></div>
            <div class="f full"><span class="lbl">Travel style</span><div class="radios" id="styles"></div></div>
          </div>
          <div class="nav-row"><button type="button" class="btn btn-ghost" data-prev>Back</button><button type="button" class="btn btn-dark" data-next>Next <svg class="ico"><use href="#i-arrow"/></svg></button></div>
        </div>

        <div class="fstep" data-step="2">
          <h2>Tell us about you</h2>
          <p class="muted">We only use this to reply to your request.</p>
          <div class="form-grid">
            <div class="f"><label for="fname">Full name</label><input class="field" id="fname" autocomplete="name" required><p class="err"></p></div>
            <div class="f"><label for="femail">Email</label><input class="field" id="femail" type="email" autocomplete="email" required><p class="err"></p></div>
            <div class="f full"><label for="fphone">Phone / WhatsApp (optional)</label><input class="field" id="fphone" type="tel" autocomplete="tel"></div>
            <div class="f full"><label for="fnotes">Anything we should know?</label><textarea class="field" id="fnotes" placeholder="Celebrations, interests, pace, dietary needs..."></textarea></div>
          </div>
          <div class="nav-row"><button type="button" class="btn btn-ghost" data-prev>Back</button><button type="submit" class="btn btn-primary">Send my request <svg class="ico"><use href="#i-arrow"/></svg></button></div>
        </div>

        <div class="fstep done" id="done" data-step="3">
          <p class="eyebrow">Request ready</p>
          <h2>Thank you, <span id="doneName"></span>.</h2>
          <p class="lead" id="doneMsg"></p>
          <a class="btn btn-dark" href="#/destinations">Keep exploring</a><a class="btn btn-ghost" href="#/">Home</a>
        </div>
      </form>

      <aside class="sticky"><div class="panel summary reveal in">
        <h3>Your trip</h3>
        <div class="sum-list" id="sumList"></div>
        <div class="sum-row"><span>Month</span><b id="sumMonth"></b></div>
        <div class="sum-row"><span>Travellers</span><b id="sumN"></b></div>
        <div class="sum-row"><span>Length</span><b id="sumNights"></b></div>
        <div class="sum-row"><span>Budget</span><b id="sumBudget"></b></div>
        <p class="muted" style="margin-top:10px">Local times update live: <span id="sumClocks"></span></p>
      </div></aside>
    </div>
  </section>
</template>
<template id="t-about">
  <header class="page-head container">
    <p class="eyebrow">Why Curaters</p>
    <h1>Travel, turned into art</h1>
    <p class="lead">Our vision is to turn travel into art: carefully curated, deeply felt, and impossible to forget.</p>
  </header>
  <section class="section" style="padding-top:20px"><div class="container"><div class="values">
    <div class="value reveal"><p class="n">01</p><h3>Curated, not crowded</h3><p>Every stay, guide and moment is chosen with care, never copied from a template.</p></div>
    <div class="value reveal"><p class="n">02</p><h3>Rooted in Africa</h3><p>From Ghana's coast to the Serengeti and the Namib, we work with local partners we trust.</p></div>
    <div class="value reveal"><p class="n">03</p><h3>Honest and personal</h3><p>You talk to real people who tell you what is realistic, and stay close while you travel.</p></div>
  </div></div></section>
  <section class="section" id="faq" style="padding-top:0"><div class="container">
    <div class="section-head reveal"><div><p class="eyebrow">Good to know</p><h2>Questions, <em class="it">answered</em></h2></div></div>
    <div class="faq" id="faqList"></div>
  </div></section>
  <section class="section" style="padding-top:0"><div class="container"><div class="contact-cards">
    <a class="ccard" id="cEmail" href="#"><p class="eyebrow">Email</p><b></b></a>
    <a class="ccard" id="cIg" href="#" target="_blank" rel="noopener noreferrer"><p class="eyebrow">Instagram</p><b>@curaters_</b></a>
    <a class="ccard" id="cTt" href="#" target="_blank" rel="noopener noreferrer"><p class="eyebrow">TikTok</p><b>@curaters</b></a>
  </div></div></section>
</template>
<template id="t-notfound"><header class="page-head container"><p class="eyebrow">Lost in the savannah</p><h1>Page not found</h1><p class="lead">That page has wandered off. Let's get you back on the trail.</p><p style="margin-top:28px"><a class="btn btn-dark" href="#/">Home</a> <a class="btn btn-ghost" href="#/destinations">Destinations</a></p></header></template>

</body>
